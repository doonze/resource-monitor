# Resource Monitor - Apache SSL Reverse Proxy Configuration
# Place this in: /etc/apache2/sites-available/resource-monitor-ssl.conf

<VirtualHost *:443>
    ServerName monitor.yourdomain.com
    ServerAdmin admin@yourdomain.com
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/monitor.yourdomain.com.crt
    SSLCertificateKeyFile /etc/ssl/private/monitor.yourdomain.com.key
    SSLCertificateChainFile /etc/ssl/certs/ca-bundle.crt
    
    # Modern SSL Configuration (TLS 1.2 and 1.3 only)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Enable HTTP/2 (if available)
    Protocols h2 http/1.1
    
    # HSTS (15768000 seconds = 6 months)
    Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains; preload"
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy (adjust as needed)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/resource-monitor-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/resource-monitor-ssl-access.log combined
    
    # Document Root
    DocumentRoot /var/www/html/resource-monitor/public
    
    <Directory /var/www/html/resource-monitor/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Enable PHP processing
        <IfModule mod_php.c>
            php_flag display_errors Off
            php_flag log_errors On
            php_value error_log /var/log/apache2/resource-monitor-php-error.log
        </IfModule>
        
        # Rewrite rules for clean URLs (optional)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            
            # Redirect to HTTPS (if accessed via HTTP somehow)
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
        </IfModule>
    </Directory>
    
    # Protect sensitive directories
    <DirectoryMatch "^/var/www/html/resource-monitor/(includes|config\.php)">
        Require all denied
    </DirectoryMatch>
    
    # Allow API access
    <Directory /var/www/html/resource-monitor/api>
        Require all granted
        
        # Enable CORS if needed (uncomment if API accessed from other domains)
        # Header set Access-Control-Allow-Origin "*"
        # Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        # Header set Access-Control-Allow-Headers "Content-Type, Authorization"
    </Directory>
    
    # Deny access to git files
    <DirectoryMatch "\.git">
        Require all denied
    </DirectoryMatch>
    
    # Deny access to hidden files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    
    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Browser Caching (for static assets)
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType application/json "access plus 0 seconds"
    </IfModule>
    
</VirtualHost>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName monitor.yourdomain.com
    ServerAdmin admin@yourdomain.com
    
    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://monitor.yourdomain.com/
    
    ErrorLog ${APACHE_LOG_DIR}/resource-monitor-http-error.log
    CustomLog ${APACHE_LOG_DIR}/resource-monitor-http-access.log combined
</VirtualHost>
