# Resource Monitor - Apache SSL Reverse Proxy Configuration
# For proxying to backend server (e.g., Apache on different port or different host)
# Place this in: /etc/apache2/sites-available/resource-monitor-reverse-proxy.conf

<VirtualHost *:443>
    ServerName monitor.yourdomain.com
    ServerAdmin admin@yourdomain.com
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/monitor.yourdomain.com.crt
    SSLCertificateKeyFile /etc/ssl/private/monitor.yourdomain.com.key
    SSLCertificateChainFile /etc/ssl/certs/ca-bundle.crt
    
    # Modern SSL Configuration (TLS 1.2 and 1.3 only)
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    
    # Enable HTTP/2 (if available)
    Protocols h2 http/1.1
    
    # HSTS (15768000 seconds = 6 months)
    Header always set Strict-Transport-Security "max-age=15768000; includeSubDomains; preload"
    
    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Content Security Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/resource-monitor-proxy-error.log
    CustomLog ${APACHE_LOG_DIR}/resource-monitor-proxy-access.log combined
    
    # ===========================================================
    # REVERSE PROXY CONFIGURATION
    # ===========================================================
    
    # Backend server configuration
    # Change this to your backend server IP and port
    # Examples:
    #   - Same server, different port: http://localhost:8080
    #   - Different server: http://backend-server.internal:80
    #   - Unix socket: unix:/var/run/resource-monitor.sock|http://localhost
    
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Backend server URL (CHANGE THIS!)
    Define BACKEND http://localhost:8080
    
    # Set timeout for slow requests (increase if needed)
    ProxyTimeout 300
    
    # Pass all requests to backend
    ProxyPass / ${BACKEND}/
    ProxyPassReverse / ${BACKEND}/
    
    # Alternative: If resource monitor is in a subdirectory on backend
    # ProxyPass /monitor ${BACKEND}/resource-monitor/
    # ProxyPassReverse /monitor ${BACKEND}/resource-monitor/
    
    # Preserve client information
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    
    # Connection settings
    <Proxy ${BACKEND}*>
        Require all granted
        
        # Connection pool settings
        # Max connections to backend (adjust based on your needs)
        ProxySet connectiontimeout=5 timeout=300 ttl=120 max=100
        
        # Retry logic
        ProxySet retry=5
    </Proxy>
    
    # ===========================================================
    # PERFORMANCE OPTIMIZATION
    # ===========================================================
    
    # Enable compression for proxied content
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
        
        # Don't compress already-compressed files
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|zip|gz|bz2)$ no-gzip
    </IfModule>
    
    # Browser caching for static assets
    <LocationMatch "\.(jpg|jpeg|gif|png|css|js|svg|ico)$">
        Header set Cache-Control "public, max-age=2592000"
    </LocationMatch>
    
    # No caching for API responses
    <LocationMatch "^/api/">
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </LocationMatch>
    
    # ===========================================================
    # WEBSOCKET SUPPORT (if needed in future)
    # ===========================================================
    
    # Uncomment if you add WebSocket support later
    # RewriteEngine On
    # RewriteCond %{HTTP:Upgrade} =websocket [NC]
    # RewriteRule /(.*)           ws://${BACKEND}/$1 [P,L]
    # RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    # RewriteRule /(.*)           http://${BACKEND}/$1 [P,L]
    
    # ===========================================================
    # HEALTH CHECK (optional)
    # ===========================================================
    
    # Simple health check endpoint that doesn't proxy
    # Useful for load balancers
    <Location /health>
        SetHandler server-status
        Require local
    </Location>
    
</VirtualHost>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName monitor.yourdomain.com
    ServerAdmin admin@yourdomain.com
    
    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://monitor.yourdomain.com/
    
    ErrorLog ${APACHE_LOG_DIR}/resource-monitor-http-error.log
    CustomLog ${APACHE_LOG_DIR}/resource-monitor-http-access.log combined
</VirtualHost>
